name: Publish game update

# 새 GASLIGHT_CITY_vX.Y.Z.html 이 올라오면 가장 높은 버전으로 update.json 을 다시 만든다.
# 앱은 이 update.json 을 보고 새 판을 내려받는다(APK 재설치 불필요).
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'GASLIGHT_CITY_v*.html'

permissions:
  contents: write

concurrency:
  group: gaslight-update
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write update.json from newest HTML
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, re
          rx = re.compile(r"^GASLIGHT_CITY_v(\d+)\.(\d+)(?:\.(\d+))?\.html$", re.I)
          found = []
          for p in Path(".").glob("GASLIGHT_CITY_v*.html"):
              m = rx.match(p.name)
              if m:
                  found.append(((int(m[1]), int(m[2]), int(m[3] or 0)), p))
          if not found:
              raise SystemExit("GASLIGHT_CITY_v*.html 파일이 없습니다.")
          (a, b, c), game = max(found, key=lambda x: x[0])
          # 9.61.0 -> 9061000
          build = a * 1_000_000 + b * 1_000 + c
          version = f"{a}.{b}.{c}"
          notes = ""
          nf = Path("notes") / f"v{version}.txt"
          if nf.exists():
              notes = nf.read_text(encoding="utf-8").strip()
          data = {
              "version": version,
              "build": build,
              "file": game.name,
              "sha256": hashlib.sha256(game.read_bytes()).hexdigest(),
              "notes": notes or f"가스등 도시 1851 v{version}",
              "mandatory": False,
          }
          Path("update.json").write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(data)

      - name: Commit update.json
        run: |
          if git diff --quiet -- update.json; then echo "already current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: publish latest game update"
          git push
